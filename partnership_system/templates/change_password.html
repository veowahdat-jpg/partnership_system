{% extends "base.html" %}
{% block title %}تغییر رمز عبور{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header"><i class="bi bi-key"></i> تغییر رمز عبور</div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">رمز فعلی</label>
                        <input type="password" name="current_password" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">رمز جدید</label>
                        <input type="password" name="new_password" class="form-control" required minlength="4">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">تکرار رمز جدید</label>
                        <input type="password" name="confirm_password" class="form-control" required minlength="4">
                    </div>
                    <button type="submit" class="btn btn-primary">تغییر رمز</button>
                    <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">انصراف</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
