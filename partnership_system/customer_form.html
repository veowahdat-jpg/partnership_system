{% extends "base.html" %}
{% block title %}{{ 'ویرایش مشتری' if customer else 'افزودن مشتری' }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-person-plus"></i> {{ 'ویرایش مشتری' if customer else 'افزودن مشتری جدید' }}
            </div>
            <div class="card-body">
                <form method="POST">
                    {% if not customer %}
                    <div class="mb-3">
                        <label class="form-label">کد مشتری *</label>
                        <input type="text" name="code" class="form-control" required placeholder="مثلاً C005">
                    </div>
                    {% endif %}
                    <div class="mb-3">
                        <label class="form-label">نام مشتری *</label>
                        <input type="text" name="name" class="form-control" required value="{{ customer.name if customer else '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">شماره تماس</label>
                        <input type="text" name="phone" class="form-control" value="{{ customer.phone if customer else '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">آدرس</label>
                        <input type="text" name="address" class="form-control" value="{{ customer.address if customer else '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">نوع سرویس</label>
                        <input type="text" name="service_type" class="form-control" value="{{ customer.service_type if customer else '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">مبلغ قرارداد / کل سرویس</label>
                        <input type="number" step="any" name="amount" class="form-control" value="{{ customer.amount if customer else 0 }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">توضیحات</label>
                        <textarea name="notes" class="form-control" rows="2">{{ customer.notes if customer else '' }}</textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">ذخیره</button>
                        <a href="{{ url_for('customers') }}" class="btn btn-outline-secondary">انصراف</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
