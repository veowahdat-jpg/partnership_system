{% extends "base.html" %}
{% block title %}ورود به سیستم{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <i class="bi bi-building" style="font-size: 3rem; color: #1a365d;"></i>
                    <h4 class="mt-2 fw-bold">سیستم اعتماد</h4>
                    <p class="text-muted small">فروش مواد و خدمات</p>
                </div>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">نام کاربری</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="form-control" required autofocus
                                   placeholder="نام کاربری خود را وارد کنید">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">رمز عبور</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" class="form-control" required
                                   placeholder="رمز عبور">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">
                        <i class="bi bi-box-arrow-in-left"></i> ورود به سیستم
                    </button>
                </form>

                <hr class="my-4">
                <div class="small text-muted text-center">
                    <p class="mb-1"><strong>کاربران پیش‌فرض:</strong></p>
                    <p class="mb-0">ادمین: <code>admin</code> / <code>admin123</code></p>
                    <p class="mb-0">شریک ۱: <code>partner1</code> / <code>p1123</code></p>
                    <p class="mb-0">شریک ۲: <code>partner2</code> / <code>p2123</code></p>
                    <p>شریک ۳: <code>partner3</code> / <code>p3123</code></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
