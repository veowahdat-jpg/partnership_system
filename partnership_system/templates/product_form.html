{% extends "base.html" %}
{% block title %}{{ 'ویرایش ماده' if product else 'افزودن ماده' }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-box-seam"></i> {{ 'ویرایش ماده' if product else 'افزودن ماده جدید' }}
            </div>
            <div class="card-body">
                <form method="POST">
                    {% if not product %}
                    <div class="mb-3">
                        <label class="form-label">کد ماده *</label>
                        <input type="text" name="code" class="form-control" required placeholder="مثلاً M006">
                    </div>
                    {% endif %}
                    <div class="mb-3">
                        <label class="form-label">نام ماده *</label>
                        <input type="text" name="name" class="form-control" required
                               value="{{ product.name if product else '' }}">
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">واحد</label>
                            <input type="text" name="unit" class="form-control"
                                   value="{{ product.unit if product else 'عدد' }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">قیمت خرید</label>
                            <input type="number" step="any" name="buy_price" class="form-control"
                                   value="{{ product.buy_price if product else 0 }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">قیمت فروش</label>
                            <input type="number" step="any" name="sell_price" class="form-control"
                                   value="{{ product.sell_price if product else 0 }}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">موجودی اولیه</label>
                        <input type="number" step="any" name="initial_stock" class="form-control"
                               value="{{ product.initial_stock if product else 0 }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">توضیحات</label>
                        <textarea name="description" class="form-control" rows="2">{{ product.description if product else '' }}</textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> ذخیره
                        </button>
                        <a href="{{ url_for('products') }}" class="btn btn-outline-secondary">انصراف</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
